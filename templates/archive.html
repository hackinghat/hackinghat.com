{% extends "base.html" %}
{% block title %}Archive · hackinghat.com{% endblock %}
{% block content %}
  <h1>Archive</h1>
  {% for year, year_posts in archive %}
  <section class="archive-year">
    <h2>{{ year }}</h2>
    <ul class="post-list">
      {% for p in year_posts %}
      <li>
        <time class="post-date">{{ p.date }}</time>
        <a class="post-link" href="{{ root }}posts/{{ p.slug }}.html">{{ p.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
{% endblock %}
