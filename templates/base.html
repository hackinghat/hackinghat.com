<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hackinghat.com{% endblock %}</title>
  <link rel="icon" href="{{ root }}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ root }}index.html">
      <svg class="bowler" viewBox="0 0 64 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="32" cy="45" rx="28" ry="5" fill="currentColor"/>
        <path d="M13 45 C13 11 51 11 51 45 Z" fill="currentColor"/>
        <rect x="13" y="40" width="38" height="4" fill="#000" fill-opacity="0.25"/>
      </svg>
      hackinghat.com
    </a>
  </header>
  <nav class="site-nav">
    <a href="{{ root }}index.html">Home</a>
    <a href="{{ root }}archive.html">Archive</a>
    <a href="{{ root }}tags/index.html">Tags</a>
    <span class="nav-tags">
      {% for tag in tags %}
      <a href="{{ root }}tags/{{ tag.slug }}.html">#{{ tag.name }}</a>
      {% endfor %}
    </span>
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    &copy; hackinghat.com
  </footer>
</body>
</html>
