<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hackinghat.com{% endblock %}</title>
  <link rel="icon" href="{{ root }}assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ root }}index.html">
      <img class="logo" src="{{ root }}assets/wizard-hat.png" alt="" width="32" height="32">
      hackinghat.com
    </a>
  </header>
  <nav class="site-nav">
    <a href="{{ root }}index.html">Home</a>
    <a href="{{ root }}archive.html">Archive</a>
    <a href="{{ root }}tags/index.html">Tags</a>
    <a href="{{ root }}about.html">About</a>
    <span class="nav-tags">
      {% for tag in tags %}
      <a href="{{ root }}tags/{{ tag.slug }}.html">#{{ tag.name }}</a>
      {% endfor %}
    </span>
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    &copy; hackinghat.com
  </footer>
</body>
</html>
