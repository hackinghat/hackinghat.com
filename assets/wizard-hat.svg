<svg viewBox="-6 -4 112 112" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="green wizard hat">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80ff80"/>
      <stop offset="0.45" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#00b800"/>
    </linearGradient>
    <linearGradient id="brimgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e600"/>
      <stop offset="1" stop-color="#00a800"/>
    </linearGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0 -8 L2.4 -2.6 8 -2.6 3.5 1 5.2 7 0 3.6 -5.2 7 -3.5 1 -8 -2.6 -2.4 -2.6 Z"
            fill="#ffd24a" stroke="#06240f" stroke-width="0.7" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- brim -->
  <g transform="translate(50 82) scale(1.12 1.45) translate(-50 -82)">
    <path d="M 4 84 L 6 80 Q 14 75 26 74 L 28 73 L 31 74.5 Q 42 72.5 50 73 L 53 74 L 55 72.8 Q 72 73.5 84 76 L 86 75 Q 93 78 96 81 L 93 83 L 97 84.5 L 94 87 Q 85 90 72 91 L 70 92.2 L 67 90.8 Q 55 92 50 91 L 47 92 L 44 90.8 Q 28 90.5 17 88 L 15 89 L 12 87 Q 7 86.5 4 84 Z"
          fill="url(#brimgrad)"/>
    <g fill="none" stroke="#06240f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 4 84 L 6 80 Q 14 75 26 74 L 28 73 L 31 74.5 Q 42 72.5 50 73"/>
      <path d="M 55 72.8 Q 72 73.5 84 76 L 86 75 Q 93 78 96 81 L 93 83 L 97 84.5 L 94 87 Q 85 90 72 91 L 70 92.2 L 67 90.8 Q 55 92 50 91"/>
      <path d="M 44 90.8 Q 28 90.5 17 88 L 15 89 L 12 87 Q 7 86.5 4 84"/>
    </g>
  </g>

  <!-- cone: tall, tip curls right; base is an arc parallel to the brim front -->
  <path d="M 23 78 L 27 68 L 25.5 65.5 L 30 57 Q 37 43 43 33 L 46 28.5 L 44.5 26 L 51 20 L 56 15.5 Q 63 8 71 6.5 L 73 8.5 L 76 6.5 Q 80 7.5 83 11 Q 72 10 66 18 L 67 22 L 65 25 Q 65.5 29 66 34 C 66 46 69 56 71 60 L 69 62 L 72 65 Q 75 71 77 78 A 27 6 0 0 1 23 78 Z"
        fill="url(#cone)"/>
  <g fill="none" stroke="#06240f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 23 78 L 27 68 L 25.5 65.5 L 30 57 Q 37 43 43 33 L 46 28.5 L 44.5 26"/>
    <path d="M 51 20 L 56 15.5 Q 63 8 71 6.5 L 73 8.5 L 76 6.5 Q 80 7.5 83 11 Q 72 10 66 18 L 67 22 L 65 25 Q 65.5 29 66 34"/>
    <path d="M 66 41 C 67 50 69 56 71 60 L 69 62 L 72 65 Q 75 71 77 78"/>
  </g>
  <path d="M 62 38 L 59.5 43 L 61.5 46 L 58.5 51" fill="none" stroke="#06240f" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- strap along the same arc, covering the cone's base edge -->
  <path d="M 23 78 A 27 6 0 0 0 77 78" fill="none" stroke="#06240f" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 23 78 A 27 6 0 0 0 77 78" fill="none" stroke="#00a800" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="82.2" r="3.4" fill="#ffd24a" stroke="#06240f" stroke-width="1.4"/>

  <!-- stars on cone (tilted) -->
  <use href="#star" x="43" y="52" width="13" height="13" transform="rotate(-18 49.5 58.5)"/>
  <use href="#star" x="49" y="30" width="9" height="9" transform="rotate(22 53.5 34.5)"/>
  <use href="#star" x="36" y="66" width="8" height="8" transform="rotate(-30 40 70)"/>

  <!-- left-side highlight, ends where it meets the strap -->
  <path d="M 27 76 C 33 58 43 36 56 22" fill="none" stroke="#b3ffb3" stroke-width="3.5"
        stroke-linecap="round" stroke-dasharray="20 4 40" opacity="0.8"/>
</svg>
